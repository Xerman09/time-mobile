name: Build Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: ⚙️ Generate native Android project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🔑 Set Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: 🔨 Build Android APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then
            BUILD_TYPE="release"
          fi
          echo "Building APK with configuration: $BUILD_TYPE"
          cd android
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
          fi

      - name: 🔍 Locate and prepare APK
        id: prepare_apk
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ No APK found in build outputs!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"

          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then
            BUILD_TYPE="release"
          fi

          APK_NAME="WorkShift-${BUILD_TYPE}-build${{ github.run_number }}.apk"
          cp "$APK_FILE" "build-output/$APK_NAME"
          cp "$APK_FILE" "build-output/WorkShift-latest.apk"
          
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          ls -la build-output/

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkShift-APK-build-${{ github.run_number }}
          path: build-output/*.apk
          retention-days: 30

      - name: 🚀 Publish / Update GitHub Release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: WorkShift Latest APK (Build #${{ github.run_number }})
          body: |
            ### WorkShift Mobile App - Automated Build
            - **Build Run**: #${{ github.run_number }}
            - **Commit**: ${{ github.sha }}
            - **Branch**: `${{ github.ref_name }}`
            - **APK Name**: `${{ steps.prepare_apk.outputs.apk_name }}`

            Download the attached APK below to install on Android devices.
          files: build-output/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
