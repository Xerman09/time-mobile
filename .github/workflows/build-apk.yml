name: Build Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ⚙️ Configure Gradle Memory & Build Properties
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC
          org.gradle.parallel=true
          org.gradle.vfs.watch=false
          EOF

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: ⚙️ Generate native Android project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: true

      - name: 🔑 Set Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: 🔨 Build Android APK
        env:
          CI: true
          NODE_OPTIONS: "--max-old-space-size=4096"
          ORG_GRADLE_PROJECT_org.gradle.jvmargs: "-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC"
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          echo "Building APK with configuration: ${BUILD_TYPE}"
          cd android
          if [ "${BUILD_TYPE}" = "debug" ]; then
            ./gradlew :app:assembleDebug --console=plain --no-daemon
          else
            ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --console=plain --no-daemon
          fi

      - name: 🔍 Locate and prepare APK
        id: prepare_apk
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ No APK found in build outputs!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"

          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          APK_NAME="WorkShift-${BUILD_TYPE}-build${{ github.run_number }}.apk"

          cp "$APK_FILE" "build-output/${APK_NAME}"
          cp "$APK_FILE" "build-output/WorkShift-latest.apk"

          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "apk_path=build-output/${APK_NAME}" >> $GITHUB_OUTPUT
          ls -la build-output/

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkShift-Android-APK
          path: build-output/*.apk
          retention-days: 30

      - name: 🚀 Publish / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: WorkShift Mobile App (Latest Build)
          draft: false
          prerelease: false
          files: build-output/*.apk
        continue-on-error: true
